services:
  mysql:
    image: mysql:8.0
    container_name: webrtc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-webrtc_db}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./webrtc-service/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--default-time-zone=+8:00",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-root123456}",
        ]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      - webrtc-network
    restart: unless-stopped

  webrtc-service:
    build:
      context: ./webrtc-service
      dockerfile: Dockerfile
    container_name: webrtc-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-webrtc_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:80,http://localhost:5173,http://127.0.0.1:80,http://127.0.0.1:5173}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - webrtc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  webrtc-frontend:
    build:
      context: ./webrtc
      dockerfile: Dockerfile
      target: ${FRONTEND_MODE:-production}
    container_name: webrtc-frontend
    environment:
      - VITE_API_URL=http://webrtc-service:8080
      - VITE_API_HOST=${VITE_API_HOST:-webrtc-service}
    ports:
      - "${FRONTEND_PORT:-80}:${FRONTEND_INTERNAL_PORT:-80}"
    depends_on:
      webrtc-service:
        condition: service_healthy
    networks:
      - webrtc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${FRONTEND_INTERNAL_PORT:-80}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    name: webrtc-mysql-data

networks:
  webrtc-network:
    name: webrtc-network
    driver: bridge
